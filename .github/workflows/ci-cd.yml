# CI/CD: lint → test → build Docker images → push to GHCR → deploy to EC2
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   EC2_HOST      — IP only, e.g. 13.61.13.161 (NOT ec2-user@...)
#   EC2_USER      — SSH user, e.g. ec2-user
#   EC2_SSH_KEY   — Full contents of your .pem file
#
# Optional repository variable (Settings → Variables → Actions):
#   EC2_DEPLOY_ENABLED = true   — skip deploy when unset/false
#
# Server setup (one-time on EC2):
#   1. Install Docker + Docker Compose
#   2. IAM role on instance: AmazonS3FullAccess (e.g. ec2-s3-pdf-access) — no AWS keys in .env
#   3. Create ~/Conversational-Document-Assistant/.env (copy from .env.example; set STORAGE_BACKEND=s3)
#   4. Add GHCR_TOKEN to server .env if images are private
#
# Manual fallback: deploy/scripts/deploy-ec2.sh or UPLOAD_TO_EC2.ps1

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and lint
        run: |
          npm install
          npm run lint

  test-backend:
    name: Test Backend
    needs: [lint-backend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  test-frontend:
    name: Test Frontend
    needs: [lint-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm install
          npm run build

  build-and-push:
    name: Build & Push Images
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: conversational-document-assistant-backend
            build_args: ""
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: conversational-document-assistant-frontend
            build_args: VITE_API_BASE=/api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}

  deploy-ec2:
    name: Deploy to EC2
    needs: [build-and-push]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.EC2_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          missing=()
          [ -z "${EC2_HOST:-}" ] && missing+=("EC2_HOST")
          [ -z "${EC2_USER:-}" ] && missing+=("EC2_USER")
          [ -z "${EC2_SSH_KEY:-}" ] && missing+=("EC2_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          if [[ "$EC2_HOST" == *"@"* ]]; then
            echo "::error::EC2_HOST must be the IP or DNS only (e.g. 13.61.13.161), not ec2-user@..."
            exit 1
          fi
          if [[ "$EC2_SSH_KEY" != *"BEGIN"* ]]; then
            echo "::error::EC2_SSH_KEY does not look like a PEM file. Paste the full .pem contents including BEGIN/END lines."
            exit 1
          fi
          echo "Deploy secrets present (host=$EC2_HOST user=$EC2_USER)."

      - name: Configure SSH key
        run: |
          set -euo pipefail
          KEY_FILE="$HOME/.ssh/ec2_deploy_key"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > "$KEY_FILE"
          sed -i 's/\r$//' "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keygen -y -f "$KEY_FILE" > /dev/null
          echo "SSH_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "SSH key file is valid."

      - name: Prepare EC2 app directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /home/runner/.ssh/ec2_deploy_key
          port: 22
          timeout: 60s
          script: mkdir -p ~/Conversational-Document-Assistant/scripts

      - name: Copy deploy files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          KEY_FILE="$HOME/.ssh/ec2_deploy_key"
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Force the legacy SCP protocol: some hardened/minimal EC2 images do not
          # expose the SFTP subsystem used by newer OpenSSH clients by default.
          scp -O -i "$KEY_FILE" -o BatchMode=yes docker-compose.prod.yml \
            "${EC2_USER}@${EC2_HOST}:Conversational-Document-Assistant/"
          scp -O -i "$KEY_FILE" -o BatchMode=yes deploy/scripts/deploy-ec2.sh \
            "${EC2_USER}@${EC2_HOST}:Conversational-Document-Assistant/deploy/scripts/"

      - name: Deploy containers on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /home/runner/.ssh/ec2_deploy_key
          port: 22
          timeout: 600s
          envs: IMAGE_TAG,REPO_OWNER
          script: |
            set -euo pipefail
            APP_DIR="$HOME/Conversational-Document-Assistant"
            mkdir -p "$APP_DIR/backend/data" "$APP_DIR/deploy/scripts"
            sed -i 's/\r$//' "$APP_DIR/deploy/scripts/deploy-ec2.sh" 2>/dev/null || true
            chmod +x "$APP_DIR/deploy/scripts/deploy-ec2.sh"
            cd "$APP_DIR"
            REGISTRY=ghcr.io REPO_OWNER="$REPO_OWNER" ./deploy/scripts/deploy-ec2.sh "$IMAGE_TAG"
