name: Deploy to Cloud Run (Backend & Frontend)

on:
  push:
    branches: [ main ]

env:
  BACKEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend:${{ github.sha }}
  FRONTEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/frontend:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build and push backend Docker image
        run: |
          docker build -t $BACKEND_IMAGE backend/
          docker push $BACKEND_IMAGE

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.CLOUD_RUN_BACKEND_SERVICE }} \
            --image $BACKEND_IMAGE \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --memory 512Mi \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
            --allow-unauthenticated

      - name: Get backend service URL
        id: backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ secrets.CLOUD_RUN_BACKEND_SERVICE }} \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)')
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $BACKEND_URL"

      - name: Build and push frontend Docker image
        run: |
          docker build -t $FRONTEND_IMAGE frontend/
          docker push $FRONTEND_IMAGE

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.CLOUD_RUN_FRONTEND_SERVICE }} \
            --image $FRONTEND_IMAGE \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --memory 256Mi \
            --set-env-vars "BACKEND_URL=${{ steps.backend-url.outputs.url }}" \
            --allow-unauthenticated

# Required repository secrets:
# - GCP_SA_KEY: service account JSON with Cloud Run & Artifact Registry / GCR permissions
# - GCP_PROJECT_ID: GCP project id
# - GCP_REGION: e.g. us-central1
# - CLOUD_RUN_BACKEND_SERVICE: backend Cloud Run service name
# - CLOUD_RUN_FRONTEND_SERVICE: frontend Cloud Run service name
# - DATABASE_URL: PostgreSQL connection string
# - JWT_SECRET: JWT signing secret
# - GROQ_API_KEY: Groq API key

